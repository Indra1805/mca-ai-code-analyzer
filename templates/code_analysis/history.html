{% extends "base/base.html" %}

{% block title %}
History
{% endblock %}

{% block content %}

<h2 class="mb-4">
    Analysis History
</h2>

<table class="table table-striped">

    <thead>
        <tr>
            <th>ID</th>
            <th>Language</th>
            <th>Date</th>
            <th></th>
        </tr>
    </thead>

    <tbody>

        {% for analysis in analyses %}

        <tr>

            <td>
                {{ analysis.id }}
            </td>

            <td>
                {{ analysis.language }}
            </td>

            <td>
                {{ analysis.created_at }}
            </td>

            <td>

                <a
                    href="{% url 'code_analysis:detail' analysis.id %}"
                    class="btn btn-sm btn-primary"
                >
                    View
                </a>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="4">
                No analyses found.
            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
